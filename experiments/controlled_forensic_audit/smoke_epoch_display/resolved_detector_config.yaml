experiment:
  name: controlled_forensic_audit
  stage: shortcut_reliance_calibration
  seed: 3407
paths:
  train_csv: /scratch/sahil/projects/img_deepfake/datasets/ffpp/split_csv2/ffpp_train.csv
  val_csv: /scratch/sahil/projects/img_deepfake/datasets/ffpp/split_csv2/ffpp_val.csv
  forensic_gt_manifest: /scratch/sahil/projects/img_deepfake/datasets/ffpp/controlled_forensic_audit/forensic_gt_manifest.csv
  output_root: experiments/controlled_forensic_audit/smoke_epoch_display
data:
  image_size: 256
  train_max_per_class: 64
  val_max_per_class: 64
loader:
  batch_size: 8
  num_workers: 8
  pin_memory: true
shortcut:
  type: checkerboard_patch
  size_px: 32
  top_px: 8
  left_px: 8
  tile_px: 4
  low_value: 0.05
  high_value: 0.95
  fake_presence_probability: 0.9
  real_presence_probability: 0.1
model:
  backbone: convnext_tiny
  pretrained: true
optimization:
  learning_rate: 0.0002
  weight_decay: 0.0001
  clean_supervision_weight: 0.5
trainer:
  max_epochs: 2
  precision: bf16-mixed
  gradient_clip_val: 1.0
validation_gates:
  auc_without_shortcut_min: 0.65
  auc_shortcut_aligned_min: 0.9
  mean_shortcut_logit_effect_min: 0.5
  aligned_reversed_auc_gap_min: 0.15
wandb:
  enabled: true
  project: RIFT-ICLR27
  name: controlled_forensic_detector
