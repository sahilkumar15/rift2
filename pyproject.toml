[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-v2"
version = "0.2.0"
description = "RIFT v2: detector training harness and score-access forensic-specificity audit"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "lightning>=2.2",
  "torchmetrics>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
logging = ["wandb>=0.17"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rift-train-detector = "detector_training.train:main"
rift-validate-detector = "detector_training.validate:main"
rift-preflight = "detector_training.preflight:main"
rift-train-controlled-detector = "controlled_forensic_audit.train:main"
rift-controlled-specificity-audit = "controlled_forensic_audit.specificity_audit.cli:main"
